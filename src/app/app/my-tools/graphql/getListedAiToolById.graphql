query GetListedAiToolById($toolId: Float!) {
  getListedAiToolById(toolId: $toolId) {
    data {
      id
      name
      slug
      shortDescription
      logoUrl
      websiteUrl
      videoUrl
      pricingType
      aiType
      toolUserTypes
      keywords
      platforms
      integrationOptions
      popularityScore
      featured
      verified
      useCases
      createdAt
      updatedAt
    }
    error {
      message
      code
      path
    }
   
  }
}