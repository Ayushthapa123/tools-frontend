<svg width="450" height="450" viewBox="0 0 450 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F2EF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ECE8E4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Primary color gradient -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B5D50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4C7C59;stop-opacity:1" />
    </linearGradient>
    
    <!-- Secondary color gradient -->
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C27C5E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EBB52C;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3A919B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#449BAF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3B5D50" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="450" height="450" rx="24" fill="url(#bgGradient)"/>
  
  <!-- Main AI Brain/Circuit Pattern -->
  <g transform="translate(75, 75)">
    <!-- Central AI Brain -->
    <circle cx="150" cy="150" r="120" fill="url(#primaryGradient)" opacity="0.1"/>
    <circle cx="150" cy="150" r="100" fill="url(#primaryGradient)" opacity="0.2"/>
    <circle cx="150" cy="150" r="80" fill="url(#primaryGradient)" opacity="0.3"/>
    
    <!-- Neural network nodes -->
    <circle cx="150" cy="100" r="12" fill="url(#primaryGradient)" filter="url(#shadow)"/>
    <circle cx="200" cy="130" r="10" fill="url(#secondaryGradient)" filter="url(#shadow)"/>
    <circle cx="100" cy="130" r="10" fill="url(#accentGradient)" filter="url(#shadow)"/>
    <circle cx="150" cy="200" r="12" fill="url(#primaryGradient)" filter="url(#shadow)"/>
    <circle cx="180" cy="180" r="8" fill="url(#secondaryGradient)" filter="url(#shadow)"/>
    <circle cx="120" cy="180" r="8" fill="url(#accentGradient)" filter="url(#shadow)"/>
    
    <!-- Neural network connections -->
    <path d="M150 100 L200 130" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.6"/>
    <path d="M150 100 L100 130" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.6"/>
    <path d="M200 130 L150 200" stroke="url(#secondaryGradient)" stroke-width="2" opacity="0.6"/>
    <path d="M100 130 L150 200" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
    <path d="M150 200 L180 180" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.6"/>
    <path d="M150 200 L120 180" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.6"/>
    <path d="M180 180 L200 130" stroke="url(#secondaryGradient)" stroke-width="2" opacity="0.6"/>
    <path d="M120 180 L100 130" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Floating AI Tools Icons -->
  <g transform="translate(50, 50)">
    <!-- Code/Development Tool -->
    <rect x="20" y="20" width="40" height="30" rx="4" fill="url(#primaryGradient)" opacity="0.8" filter="url(#shadow)"/>
    <rect x="25" y="25" width="8" height="8" fill="white" opacity="0.9"/>
    <rect x="35" y="25" width="8" height="8" fill="white" opacity="0.9"/>
    <rect x="45" y="25" width="8" height="8" fill="white" opacity="0.9"/>
    <rect x="25" y="35" width="8" height="8" fill="white" opacity="0.9"/>
    <rect x="35" y="35" width="8" height="8" fill="white" opacity="0.9"/>
    
    <!-- Design Tool -->
    <circle cx="350" cy="50" r="20" fill="url(#secondaryGradient)" opacity="0.8" filter="url(#shadow)"/>
    <path d="M340 50 L350 40 L360 50 L350 60 Z" fill="white" opacity="0.9"/>
    
    <!-- Marketing Tool -->
    <rect x="320" y="320" width="50" height="35" rx="6" fill="url(#accentGradient)" opacity="0.8" filter="url(#shadow)"/>
    <circle cx="330" cy="330" r="3" fill="white" opacity="0.9"/>
    <circle cx="340" cy="330" r="3" fill="white" opacity="0.9"/>
    <circle cx="350" cy="330" r="3" fill="white" opacity="0.9"/>
    <circle cx="360" cy="330" r="3" fill="white" opacity="0.9"/>
    <rect x="330" y="340" width="30" height="2" fill="white" opacity="0.9"/>
    <rect x="330" y="345" width="20" height="2" fill="white" opacity="0.9"/>
    
    <!-- Business Tool -->
    <rect x="30" y="320" width="45" height="30" rx="4" fill="url(#primaryGradient)" opacity="0.8" filter="url(#shadow)"/>
    <rect x="35" y="325" width="35" height="3" fill="white" opacity="0.9"/>
    <rect x="35" y="330" width="25" height="3" fill="white" opacity="0.9"/>
    <rect x="35" y="335" width="30" height="3" fill="white" opacity="0.9"/>
    <rect x="35" y="340" width="20" height="3" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Central Logo/Text Area -->
  <g transform="translate(150, 200)">
    <!-- ToolsLand.ai text background -->
    <rect x="-80" y="-15" width="160" height="30" rx="15" fill="white" opacity="0.9" filter="url(#shadow)"/>
    
    <!-- Main text -->
    <text x="0" y="5" text-anchor="middle" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="url(#primaryGradient)">
      ToolsLand.ai
    </text>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.3">
    <!-- Floating particles -->
    <circle cx="80" cy="100" r="3" fill="url(#primaryGradient)"/>
    <circle cx="370" cy="120" r="2" fill="url(#secondaryGradient)"/>
    <circle cx="60" cy="300" r="2" fill="url(#accentGradient)"/>
    <circle cx="390" cy="280" r="3" fill="url(#primaryGradient)"/>
    <circle cx="100" cy="380" r="2" fill="url(#secondaryGradient)"/>
    <circle cx="350" cy="400" r="2" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Connection lines between elements -->
  <g opacity="0.2" stroke-width="1">
    <path d="M80 100 L150 150" stroke="url(#primaryGradient)"/>
    <path d="M370 120 L300 150" stroke="url(#secondaryGradient)"/>
    <path d="M60 300 L120 200" stroke="url(#accentGradient)"/>
    <path d="M390 280 L320 200" stroke="url(#primaryGradient)"/>
  </g>
</svg>
